name: gesture_ai
description: A Flutter mobile app for ASL gesture recognition using TensorFlow Lite
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # ML & Vision
  tflite_flutter: ^0.10.4
  camera: ^0.10.5+9
  google_mlkit_pose_detection: ^0.11.0
  
  # MediaPipe alternative - using hand_landmark_detection or custom implementation
  # For now, we'll use a simpler approach with camera and process frames
  
  # Text to Speech
  flutter_tts: ^4.0.2
  
  # HTTP & API
  http: ^1.1.2
  dio: ^5.4.0
  socket_io_client: ^2.0.3+1
  
  # State Management
  provider: ^6.1.1
  
  # Utilities
  path_provider: ^2.1.1
  shared_preferences: ^2.2.2
  permission_handler: ^11.1.0
  cached_network_image: ^3.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  
  assets:
    - assets/tsl_gesture_model.tflite
    - assets/tsl_gesture_classes.json
    - assets/tsl_word_mappings.json
    - assets/tsl_letter_mappings.json
    - assets/gestures/

