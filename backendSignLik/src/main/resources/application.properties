spring.application.name=backendSignLik
# Application
server.port=8081

# JWT Settings (must be at least 64 characters for HS512)
jwt.secret=mySuperSecretKey123456789101112131415161718192021222324252627282930313233343536373839404142434445464748495051525354555657585960616263646566676869707172737475767778798081828384858687888990919293949596979899100
jwt.expiration=86400000

# Database Configuration (MySQL)
# IMPORTANT: Update the username and password below to match your MySQL installation
# Common scenarios:
# - Default MySQL: username=root, password=(your MySQL root password)
# - XAMPP: username=root, password=(empty or '')
# - WAMP: username=root, password=(empty or '')
# - Docker: username=root, password=root (default)
# If MySQL is on a different port, change 3306 to your port
spring.datasource.url=jdbc:mysql://localhost:3306/signlikdb?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA/Hibernate
# Explicitly set dialect for MySQL (required to avoid connection issues during startup)
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# MinIO/S3 Storage Configuration
storage.minio.endpoint=http://localhost:9000
storage.minio.access-key=minioadmin
storage.minio.secret-key=minioadmin
storage.minio.bucket-name=signlik-media
storage.url-expiration-seconds=3600

# File Upload Configuration
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# Async Processing
spring.task.execution.pool.core-size=5
spring.task.execution.pool.max-size=10
spring.task.execution.pool.queue-capacity=100

# Swagger/OpenAPI
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true

# TSL Model Configuration
tsl.model.path=classpath:models/tsl_gesture_model.tflite
tsl.classes.path=classpath:models/tsl_gesture_classes.json
tsl.python.script=classpath:python/infer_tsl.py
tsl.python.command=python3

